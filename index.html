  <style amp-custom>
    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      font-family:'Rajdhani',Arial,Helvetica,sans-serif;
      color:#fff;
      background:#050506;
    }

    body{
      background:
        radial-gradient(circle at 50% -10%,rgba(225, 0, 146, 0.25) 0,rgba(24, 10, 18, 0.85) 30%,rgba(10, 10, 12, 0.98) 70%,#030304 100%),
        radial-gradient(circle at 18% 24%,rgba(225, 0, 146, 0.08) 0,transparent 20%),
        radial-gradient(circle at 82% 24%,rgba(225, 0, 146, 0.12) 0,transparent 20%),
        linear-gradient(90deg,rgba(225, 0, 146, 0.02),transparent 28%,transparent 72%,rgba(225, 0, 146, 0.02)),
        #050506;
    }

    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      background:
        linear-gradient(115deg,transparent 0 42%,rgba(255,255,255,.02) 43%,transparent 45% 100%),
        linear-gradient(65deg,transparent 0 42%,rgba(255,255,255,.015) 43%,transparent 45% 100%),
        repeating-linear-gradient(0deg,rgba(255,255,255,.01) 0 1px,transparent 1px 18px),
        repeating-linear-gradient(90deg,rgba(225, 0, 146, 0.02) 0 1px,transparent 1px 24px),
        radial-gradient(circle at center,transparent 0,rgba(0,0,0,.45) 58%,rgba(0,0,0,.92) 100%);
      opacity:.92;
    }

    body:after{
      content:"";
      position:fixed;
      inset:auto -12% -24% -12%;
      height:54%;
      pointer-events:none;
      z-index:0;
      background:
        radial-gradient(ellipse at center,rgba(225, 0, 146, 0.2) 0,rgba(20, 5, 14, 0.15) 38%,transparent 72%),
        repeating-linear-gradient(90deg,rgba(225, 0, 146, .06) 0 2px,transparent 2px 92px),
        linear-gradient(180deg,transparent,rgba(0,0,0,.85));
      transform:perspective(720px) rotateX(60deg);
      transform-origin:center bottom;
      opacity:.62;
    }

    .splash-screen{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      z-index:999999;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 38%,rgba(225, 0, 146, .2) 0,rgba(225, 0, 146, .08) 24%,transparent 48%),
        radial-gradient(circle at 50% 50%,rgba(225, 0, 146, 0.05) 0,transparent 42%),
        linear-gradient(180deg,#1f0014 0,#090407 48%,#000 100%);
      animation:splashFadeOut .65s ease-in-out 1.05s forwards;
    }

    .splash-screen:before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(115deg,transparent 0 43%,rgba(255,255,255,.03) 44%,transparent 46% 100%),
        repeating-linear-gradient(90deg,rgba(225, 0, 146, .04) 0 1px,transparent 1px 28px),
        radial-gradient(circle at center,transparent 0,rgba(0,0,0,.6) 72%,rgba(0,0,0,.98) 100%);
      opacity:.8;
    }

    .splash-logo{
      width:230px;
      max-width:60vw;
      position:relative;
      z-index:2;
      display:block;
      animation:
        splashLogoPop .75s cubic-bezier(.2,.85,.25,1.18) both,
        splashLogoGlow 1.45s ease-in-out infinite;
    }

    @keyframes splashFadeOut{
      0%{opacity:1;visibility:visible}
      99%{opacity:0;visibility:visible}
      100%{opacity:0;visibility:hidden}
    }

    @keyframes splashLogoPop{
      0%{opacity:0;transform:scale(.72) translateY(16px)}
      55%{opacity:1;transform:scale(1.06) translateY(0)}
      100%{opacity:1;transform:scale(1) translateY(0)}
    }

    @media(max-width:560px){
      .splash-logo{
        width:190px;
        max-width:66vw;
      }
    }

    /* ===== yunnay ===== */
    .yunnay-logo-wrap {
      width: 60px;
      height: 60px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      isolation: isolate;
      perspective: 500px;
      margin-top: 18px;
    }

    /* gelembung menguap */
    .yunnay-logo-wrap::before,
    .yunnay-logo-wrap::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 50%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%,
        rgba(255, 230, 245, 0.95),
        rgb(225, 0, 146) 45%,
        rgba(30, 0, 18, 0.08) 75%
      );
      box-shadow:
        -11px -5px 0 -2px rgba(255, 51, 184, 0.75),
        10px -9px 0 -3px rgba(225, 0, 146, 0.72),
        2px -18px 0 -4px rgba(255, 200, 240, 0.55);
      filter: blur(0.2px);
      opacity: 0;
      transform: translateX(-50%) scale(0.4);
      animation: vaporBubble 2.8s ease-in-out infinite;
      z-index: -1;
    }

    .yunnay-logo-wrap::after {
      animation-delay: 1.35s;
      left: 44%;
      width: 5px;
      height: 5px;
    }

    .yunnay-logo {
      width: 80px;
      height: auto;
      display: block;
      position: relative;
      z-index: 2;
      transform-origin: center;
      filter:
        drop-shadow(0 0 5px rgba(255, 51, 184, 0.75))
        drop-shadow(0 0 12px rgba(225, 0, 146, 0.38));
      animation:
        trapWarpSpin 4.2s cubic-bezier(.68,-0.55,.27,1.55) infinite,
        trapGlow 2.4s ease-in-out infinite;
      will-change: transform, filter;
    }

    .yunnay-logo-wrap:hover .trap-logo {
      animation-duration: 1.5s, 1.2s;
      filter:
        drop-shadow(0 0 7px rgb(225, 0, 146))
        drop-shadow(0 0 18px rgba(138, 83, 12, 0.8));
    }

    @keyframes trapWarpSpin {
      0% { transform: rotate(0deg) scale(1) skew(0deg, 0deg); }
      18% { transform: rotate(8deg) scaleX(1.18) scaleY(0.82) skew(-7deg, 2deg); }
      32% { transform: rotate(-10deg) scaleX(0.82) scaleY(1.18) skew(6deg, -3deg); }
      48% { transform: rotateY(180deg) scale(1.05) skew(0deg, 0deg); }
      64% { transform: rotate(-6deg) scaleX(1.12) scaleY(0.9) skew(4deg, -2deg); }
      82% { transform: rotate(5deg) scaleX(0.94) scaleY(1.08) skew(-3deg, 2deg); }
      100% { transform: rotate(0deg) rotateY(360deg) scale(1) skew(0deg, 0deg); }
    }

    @keyframes trapGlow {
      0%, 100% {
        filter:
          drop-shadow(0 0 4px rgba(255, 51, 184, 0.55))
          drop-shadow(0 0 9px rgba(225, 0, 146, 0.28));
      }
      50% {
        filter:
          drop-shadow(0 0 8px rgb(255, 80, 201))
          drop-shadow(0 0 20px rgba(225, 0, 146, 0.75));
      }
    }

    @keyframes vaporBubble {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.25); }
      20% { opacity: 0.9; }
      65% { opacity: 0.45; transform: translate(-65%, -20px) scale(1.15); }
      100% { opacity: 0; transform: translate(-35%, -34px) scale(1.7); }
    }
