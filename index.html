  <style amp-custom>
    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      font-family:'Rajdhani',Arial,Helvetica,sans-serif;
      color:#fff;
      background:#010912;
      overflow-x:hidden;
    }

   
    body{
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 110, 180, 0.4) 0%, rgba(2, 28, 54, 0.85) 50%, #010811 100%),
        #010912;
      will-change: background;
      animation: oceanDeepGlow 5s infinite;
    }

    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
      background:
        radial-gradient(circle at center, transparent 30%, rgba(0, 5, 15, 0.85) 100%),
        repeating-linear-gradient(0deg, rgba(0, 240, 255, 0.015) 0 1px, transparent 1px 12px);
    }

    @keyframes oceanDeepGlow {
      0%, 82%, 87%, 92%, 100% {
        background: radial-gradient(circle at 50% 0%, rgba(0, 110, 180, 0.4) 0%, rgba(2, 28, 54, 0.85) 50%, #010811 100%), #010912;
      }
      84% {
        background: radial-gradient(circle at 50% 10%, rgba(0, 240, 255, 0.65) 0%, rgba(0, 80, 160, 0.8) 45%, #021226 100%), #021226;
      }
      89% {
        background: radial-gradient(circle at 50% 30%, rgba(180, 245, 255, 0.85) 0%, rgba(0, 180, 255, 0.7) 40%, #010c1e 100%), #010c1e;
      }
    }

   
    .ocean-caustics {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at 50% -20%, rgba(0, 240, 255, 0.3) 0%, transparent 70%);
      opacity: 0.6;
      filter: blur(10px);
      animation: waveCaustics 6s ease-in-out infinite alternate;
    }

    @keyframes waveCaustics {
      0% { transform: scale(1) translateY(0); opacity: 0.5; }
      50% { transform: scale(1.1) translateY(15px); opacity: 0.8; }
      100% { transform: scale(1) translateY(0); opacity: 0.5; }
    }

    
    .bubbles-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -30px;
      background: rgba(0, 240, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.7), 0 0 8px rgba(0, 240, 255, 0.4);
      animation: bubbleRise 8s infinite linear;
    }

    
    .bubble:nth-child(1)  { left: 5%;  width: 10px; height: 10px; animation-duration: 6.5s; animation-delay: 0s; }
    .bubble:nth-child(2)  { left: 12%; width: 20px; height: 20px; animation-duration: 8.5s; animation-delay: 1.5s; }
    .bubble:nth-child(3)  { left: 20%; width: 8px;  height: 8px;  animation-duration: 5.5s; animation-delay: 3s; }
    .bubble:nth-child(4)  { left: 28%; width: 14px; height: 14px; animation-duration: 7s;   animation-delay: 0.5s; }
    .bubble:nth-child(5)  { left: 35%; width: 24px; height: 24px; animation-duration: 9.5s; animation-delay: 2.2s; }
    .bubble:nth-child(6)  { left: 43%; width: 12px; height: 12px; animation-duration: 6s;   animation-delay: 4s; }
    .bubble:nth-child(7)  { left: 50%; width: 18px; height: 18px; animation-duration: 8s;   animation-delay: 1s; }
    .bubble:nth-child(8)  { left: 58%; width: 9px;  height: 9px;  animation-duration: 6.8s; animation-delay: 2.7s; }
    .bubble:nth-child(9)  { left: 65%; width: 22px; height: 22px; animation-duration: 9s;   animation-delay: 0.2s; }
    .bubble:nth-child(10) { left: 72%; width: 15px; height: 15px; animation-duration: 7.2s; animation-delay: 3.5s; }
    .bubble:nth-child(11) { left: 80%; width: 11px; height: 11px; animation-duration: 6.2s; animation-delay: 1.8s; }
    .bubble:nth-child(12) { left: 86%; width: 25px; height: 25px; animation-duration: 10s;  animation-delay: 0.8s; }
    .bubble:nth-child(13) { left: 92%; width: 13px; height: 13px; animation-duration: 7.8s; animation-delay: 2.5s; }
    .bubble:nth-child(14) { left: 16%; width: 16px; height: 16px; animation-duration: 8.2s; animation-delay: 4.5s; }
    .bubble:nth-child(15) { left: 68%; width: 10px; height: 10px; animation-duration: 5.8s; animation-delay: 1.2s; }

    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
    }

    
    .underwater-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: rgba(0, 230, 255, 0.65);
      mix-blend-mode: color-dodge;
      opacity: 0;
      filter: blur(12px);
      will-change: opacity;
      animation: oceanFlash 5s infinite;
    }

    .underwater-bolt {
      position: fixed;
      top: -5%;
      left: 15%;
      width: 70vw;
      height: 110vh;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      filter: blur(4px) drop-shadow(0 0 30px #00f0ff) drop-shadow(0 0 60px #0088ff);
      will-change: opacity, transform;
      animation: oceanBolt 5s infinite;
    }

    @keyframes oceanFlash {
      0%, 82%, 87%, 92%, 100% { opacity: 0; }
      83% { opacity: 0.4; }
      88% { opacity: 0.9; }
      90% { opacity: 0.2; }
    }

    @keyframes oceanBolt {
      0%, 82%, 87%, 92%, 100% { opacity: 0; transform: scale(0.95) skewX(2deg); }
      83% { opacity: 0.5; transform: scale(1.02) skewX(-3deg); }
      88% { opacity: 0.85; transform: scale(1.05) skewX(4deg); }
      90% { opacity: 0.3; transform: scale(1) skewX(0deg); }
    }

    
    .splash-screen{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      z-index:999999;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      background:#010811;
      will-change: opacity, transform;
      animation: ps5FadeOut 0.4s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
    }

    .ps5-bg{
      position:absolute;
      inset:-10%;
      background: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.25) 0%, #01050d 70%);
      filter:blur(15px);
    }

    .ps5-container{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .splash-logo{
      width:220px;
      max-width:60vw;
      display:block;
      opacity:0;
      transform:scale(0.9);
      will-change: transform, opacity;
      animation: ps5LogoEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    .ps5-loader{
      width:160px;
      height:3px;
      background:rgba(255, 255, 255, 0.1);
      border-radius:4px;
      margin-top:25px;
      position:relative;
      overflow:hidden;
      opacity:0;
      animation: ps5FadeIn 0.3s ease 0.3s forwards;
    }

    .ps5-loader-bar{
      position:absolute;
      left:0;
      top:0;
      height:100%;
      width:0%;
      background: linear-gradient(90deg, #00f0ff, #0077ff);
      box-shadow: 0 0 10px #00f0ff;
      will-change: width;
      animation: ps5LoadProgress 0.7s cubic-bezier(0.65, 0, 0.35, 1) 0.4s forwards;
    }

    @keyframes ps5LogoEnter{
      0%{ opacity:0; transform:scale(0.9); }
      100%{ opacity:1; transform:scale(1); }
    }

    @keyframes ps5LoadProgress{
      0%{ width:0%; }
      100%{ width:100%; }
    }

    @keyframes ps5FadeIn{
      to{ opacity:1; }
    }

    @keyframes ps5FadeOut{
      0%{ opacity:1; visibility:visible; }
      99%{ opacity:0; visibility:visible; }
      100%{ opacity:0; visibility:hidden; display:none; }
    }

    
    .page{
      position:relative;
      z-index:3;
      width:100%;
      min-height:100svh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px 12px 22px;
    }

    .arena{
      width:100%;
      max-width:min(460px,92vw,calc(100svh - 235px));
      margin:0 auto;
      text-align:center;
      position:relative;
    }

    .top-brand{
      position:relative;
      z-index:3;
      margin:0 auto 13px;
      text-align:center;
    }

    .hero-logo{
      width:190px;
      max-width:58vw;
      margin:0 auto 20px;
      display:block;
      filter: drop-shadow(0 7px 14px rgba(0,0,0,.85));
    }

    .hero-title{
      font-family:'Orbitron','Rajdhani',Arial,sans-serif;
      margin:0 auto;
      max-width:96%;
      color:#fffcfb;
      font-size:17px;
      line-height:1.3;
      font-weight:900;
      letter-spacing:1.15px;
      text-transform:uppercase;
      text-shadow: 0 3px 12px rgba(0,0,0,.92);
    }

    
    .banner-frame{
      position:relative;
      padding:3px;
      border-radius:24px;
      background: linear-gradient(135deg, #003e66 0%, #00f0ff 50%, #001a33 100%);
      box-shadow: 0 22px 56px rgba(0,0,0,.9), 0 0 30px rgba(0, 240, 255, 0.35);
      will-change: filter, box-shadow;
      animation: bannerOceanGlow 5s infinite;
    }

    .banner{
      position:relative;
      overflow:hidden;
      border-radius:21px;
      background:#020b14;
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(0, 240, 255, 0.4) 50%, transparent 100%);
      opacity: 0;
      mix-blend-mode: overlay;
      will-change: opacity;
      animation: bannerAquaFlash 5s infinite;
    }

    @keyframes bannerOceanGlow {
      0%, 82%, 87%, 92%, 100% {
        box-shadow: 0 22px 56px rgba(0,0,0,.9), 0 0 25px rgba(0, 240, 255, 0.35);
        filter: brightness(1);
      }
      83% {
        box-shadow: 0 0 45px #00f0ff, 0 0 75px rgba(0, 240, 255, 0.8);
        filter: brightness(1.3);
      }
      88% {
        box-shadow: 0 0 70px #ffffff, 0 0 110px #00f0ff;
        filter: brightness(1.8);
      }
    }

    @keyframes bannerAquaFlash {
      0%, 82%, 87%, 92%, 100% { opacity: 0; }
      83% { opacity: 0.5; }
      88% { opacity: 0.95; }
    }

    
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .vvip-btn {
      font-family: 'Orbitron', 'Rajdhani', Arial, sans-serif;
      position: relative;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.2px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .vvip-btn::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -70%;
      width: 50%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transform: rotate(25deg);
      animation: btnShine 3.5s ease-in-out infinite;
      z-index: 2;
    }

    .login {
      color: #00f0ff;
      background: rgba(0, 240, 255, 0.08);
      border: 1.5px solid rgba(0, 240, 255, 0.6);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .login:hover {
      background: rgba(0, 240, 255, 0.25);
      color: #fff;
      transform: translateY(-2px);
    }

    .daftar {
      color: #fff;
      background: linear-gradient(135deg, #0088ff 0%, #004499 100%);
      border: 1.5px solid #00d5ff;
      box-shadow: 0 0 18px rgba(0, 200, 255, 0.4);
    }

    .daftar:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #0099ff 0%, #0055cc 100%);
    }

    @keyframes btnShine {
      0% { left: -70%; }
      30% { left: 150%; }
      100% { left: 150%; }
    }

   
    .about-box{
      position:relative;
      display:grid;
      grid-template-columns:50px 1fr;
      gap:12px;
      align-items:center;
      margin:18px auto 0;
      padding:14px 16px;
      text-align:left;
      border-radius:14px;
      background: rgba(2, 18, 36, 0.9);
      border:1px solid rgba(0, 240, 255, 0.4);
    }

    .about-title{
      font-family:'Orbitron',sans-serif;
      margin:0 0 4px;
      color:#fff;
      font-size:14px;
      font-weight:900;
      letter-spacing:1px;
    }

    .about-desc{
      margin:0;
      color:rgba(230, 245, 255, .85);
      font-size:12px;
      line-height:1.5;
    }

    .site-footer{
      margin:16px auto 0;
      text-align:center;
    }

    .copyright{
      font-family:'Orbitron',sans-serif;
      font-size:11px;
      color:rgba(230, 245, 255, 0.7);
    }

    .footer-brand-link{
      color:#00f0ff;
      font-weight:800;
      text-decoration:none;
    }

    @media(max-width:560px){
      .page{ padding:12px 9px 18px; }
      .arena{ max-width:calc(100vw - 18px); }
      .vvip-btn{ min-height:46px; font-size:14px; }
      .hero-logo{ width:150px; }
    }
  </style>
</head>
